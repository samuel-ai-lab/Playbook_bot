name: Run Playbook Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: playbook-factory-main
  cancel-in-progress: false

jobs:
  run-playbook-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write .env file
        run: |
          printf "%s" "${{ secrets.PLAYBOOK_FACTORY_ENV }}" > .env

      - name: Write yt-dlp cookies file (optional)
        env:
          YTDLP_COOKIES_TXT: ${{ secrets.YTDLP_COOKIES_TXT }}
        run: |
          if [ -n "$YTDLP_COOKIES_TXT" ]; then
            printf "%s" "$YTDLP_COOKIES_TXT" > /tmp/ytdlp_cookies.txt
            printf "\nYTDLP_COOKIES_FILE=/tmp/ytdlp_cookies.txt\n" >> .env
          fi

      - name: Run pipeline
        run: python main.py
