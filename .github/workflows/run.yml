name: Run Playbook Factory

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: playbook-factory-main
  cancel-in-progress: false

jobs:
  run-playbook-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write .env file
        run: |
          printf "%s" "${{ secrets.PLAYBOOK_FACTORY_ENV }}" > .env

      - name: Write yt-dlp cookies file (optional)
        env:
          YTDLP_COOKIES_TXT: ${{ secrets.YTDLP_COOKIES_TXT }}
          YTDLP_COOKIES_TXT_P1: ${{ secrets.YTDLP_COOKIES_TXT_P1 }}
          YTDLP_COOKIES_TXT_P2: ${{ secrets.YTDLP_COOKIES_TXT_P2 }}
          YTDLP_COOKIES_TXT_P3: ${{ secrets.YTDLP_COOKIES_TXT_P3 }}
          YTDLP_COOKIES_TXT_P4: ${{ secrets.YTDLP_COOKIES_TXT_P4 }}
          YTDLP_COOKIES_TXT_P5: ${{ secrets.YTDLP_COOKIES_TXT_P5 }}
          YTDLP_COOKIES_TXT_P6: ${{ secrets.YTDLP_COOKIES_TXT_P6 }}
        run: |
          if [ -n "$YTDLP_COOKIES_TXT" ]; then
            printf "%s" "$YTDLP_COOKIES_TXT" > /tmp/ytdlp_cookies.txt
          elif [ -n "$YTDLP_COOKIES_TXT_P1" ]; then
            : > /tmp/ytdlp_cookies.txt
            for part in \
              "$YTDLP_COOKIES_TXT_P1" \
              "$YTDLP_COOKIES_TXT_P2" \
              "$YTDLP_COOKIES_TXT_P3" \
              "$YTDLP_COOKIES_TXT_P4" \
              "$YTDLP_COOKIES_TXT_P5" \
              "$YTDLP_COOKIES_TXT_P6"
            do
              if [ -n "$part" ]; then
                printf "%s" "$part" >> /tmp/ytdlp_cookies.txt
              fi
            done
          fi

          if [ -s /tmp/ytdlp_cookies.txt ]; then
            printf "\nYTDLP_COOKIES_FILE=/tmp/ytdlp_cookies.txt\n" >> .env
          fi

      - name: Run pipeline
        run: python main.py
